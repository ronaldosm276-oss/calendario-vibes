[package]
name = "calendar-gadget"
version = "0.1.0"
description = "A compact Windows desktop Google Calendar gadget"
authors = ["Personal"]
edition = "2021"
rust-version = "1.90"


[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
tiny_http = "0.12"
url = "2"
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
